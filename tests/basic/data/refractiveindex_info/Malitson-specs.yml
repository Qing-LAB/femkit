# Malitson.yml with a SPECS block written for femkit's tests: a file of the source can say in
# one that its wavelengths are in air, or its index relative to air (material-data.md § 4).

REFERENCES: |
    I. H. Malitson.
    Interspecimen comparison of the refractive index of fused silica.
    [*J. Opt. Soc. Am.* **55**, 1205-1208 (1965)](https://doi.org/10.1364/JOSA.55.001205)
NOTES: |
    Fused silica, 20 °C
SPECS:
    wavelength_vacuum: false
    n_absolute: false
DATA:
  - type: formula 1
    wavelength_range: 0.21 3.71
    coefficients: 0 0.6961663 0.0684043 0.4079426 0.1162414 0.8974794 9.896161
