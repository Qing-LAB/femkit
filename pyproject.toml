# Developer-tool configuration only: femkit runs from its checkout and is
# never installed (docs/contracts/envs.md § 7).

[tool.pytest.ini_options]
testpaths = ["tests/basic"]   # plain `pytest` runs the basic tier; tools/testrun.py runs each tier (testing.md § 4)
pythonpath = ["."]           # the checkout: femkit and tests/ import from it, with or without `python -m`
norecursedirs = [".git", ".test-progress", "*.egg-info"]
addopts = "-ra"
xfail_strict = true
