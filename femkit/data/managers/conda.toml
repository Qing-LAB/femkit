version = ["{exe}", "--version"]
version_pattern = '(\d+\.\d+(?:\.\d+)?)'
root = { argv = ["{exe}", "info", "--json"], key = "root_prefix" }
platform = { argv = ["{exe}", "info", "--json"], key = "platform" }
run = ["{exe}", "run", "--no-capture-output", "-p", "{prefix}"]
activate = { hook = "{root}/etc/profile.d/conda.sh", with_hook = ["conda", "activate", "{prefix}"], without_hook = ["source", "activate", "{prefix}"] }
# Nothing from the person's own conda settings enters a prefix (envs.md § 4.4): a create
# overrides their channels with the declared ones and adds none of their default packages.
# The control environment is this create too, its packages read from control.txt (`--file`).
create = ["{exe}", "create", "-y", "-p", "{prefix}", "--override-channels", "--no-default-packages"]
channel = ["-c", "{channel}"]
create_from_lock = ["{exe}", "create", "-y", "-p", "{prefix}", "--file", "{file}", "--no-default-packages", "--override-channels"]
export_lock = ["{exe}", "list", "--explicit", "--md5", "-p", "{prefix}"]
remove = ["{exe}", "remove", "--all", "-y", "-p", "{prefix}", "--override-channels"]
# With the declared channels: conda 26 otherwise checks the terms of the base configuration's
# defaults, and a create from a saved lock or a removal stops (measured, envs.md § 4.4).
channels_named = ["create_from_lock", "remove"]
