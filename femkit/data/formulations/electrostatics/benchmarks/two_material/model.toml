# The two-material benchmark (docs/science/electrostatics.md § 9): a layered capacitor, two
# materials in series between two held potentials. Its exact solution is piecewise linear.
schema = 1
formulation = "electrostatics"

[parameters]
bias = "1 V"

[frame]
unit = "m"

[geometry]
dimension = 2
meaning = "per unit depth"

[geometry.shapes]
left_half = { kind = "rectangle", corner = [0, 0], size = [0.5, 1] }
right_half = { kind = "rectangle", corner = [0.5, 0], size = [0.5, 1] }

[regions]
low = { kind = "domain", shapes = ["left_half"] }
high = { kind = "domain", shapes = ["right_half"] }
middle = { kind = "interface", between = ["low", "high"] }
left = { kind = "boundary", plane = { point = [0, 0], normal = [-1, 0] } }
right = { kind = "boundary", plane = { point = [1, 0], normal = [1, 0] } }
sides = { kind = "boundary", rest = true }

[materials.one.relative_permittivity]
value = "1"
convention = "real"
source = "a benchmark's choice"
range = "all"

[materials.four.relative_permittivity]
value = "4"
convention = "real"
source = "a benchmark's choice"
range = "all"

[assign]
low = "one"
high = "four"

[conditions]
left = { kind = "potential", value = "0 V" }
right = { kind = "potential", value = "bias" }
sides = { kind = "insulating" }
middle = { kind = "interface" }
