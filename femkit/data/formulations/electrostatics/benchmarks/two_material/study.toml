# What the two-material benchmark reads (docs/science/electrostatics.md § 9). First-order
# elements reproduce its piecewise-linear solution: any mesh with a node line on the interface.
schema = 1

[numerics]
element = { family = "lagrange", degree = 1 }
geometry_order = 1
mesh = { unit = "m", size = "0.25 m" }
solver = { kind = "direct" }

[observables.potential_low]
quantity = "potential"
support = { point = [0.25, 0.5] }
reduction = "value"
unit = "V"

[observables.potential_middle]
quantity = "potential"
support = { point = [0.5, 0.5] }
reduction = "value"
unit = "V"

[observables.potential_high]
quantity = "potential"
support = { point = [0.75, 0.5] }
reduction = "value"
unit = "V"

[observables.energy_low]
quantity = "energy_density"
support = { region = "low" }
reduction = "integral"
unit = "J/m"

[observables.energy_high]
quantity = "energy_density"
support = { region = "high" }
reduction = "integral"
unit = "J/m"
