# The electrostatic potential. Every term, equation and sign is defined in its science
# document; each description here is the one sentence a person reads beside the choice —
# a tooltip, a hint, a line of the reference — and `section` points to where it is defined.
description = "the electrostatic potential: -div(eps grad phi) = rho"
kinds = ["stationary"]                           # the step kinds it supports (models.md § 4.2)
science = "docs/science/electrostatics.md"
unknown = { name = "potential", space = "H1", unit = "V" }
meanings = { 2 = ["per unit depth", "axisymmetric"], 3 = ["full"] }
conventions = []

[constants.vacuum_permittivity]
description = "eps_0, the vacuum permittivity (CODATA 2022), given to every engine as stated here"
section = "1-terms-and-symbols"
value = "8.8541878188e-12 F/m"

[properties.relative_permittivity]
description = "the material's relative permittivity, eps_r: a real, positive number"
section = "1-terms-and-symbols"
unit = "1"
complex = false

[conditions.potential]
description = "the boundary is held at a potential (a Dirichlet condition)"
section = "3-conditions-on-an-outer-boundary"
on = ["outer_boundary"]
parameters.value = { unit = "V", description = "the potential the boundary is held at" }

[conditions.insulating]
description = "no field line crosses the boundary: n . D = 0 (the natural condition)"
section = "3-conditions-on-an-outer-boundary"
on = ["outer_boundary"]

[conditions.surface_charge]
description = "the boundary is the surface of a conductor carrying a free charge; femkit writes n . D = -sigma"
section = "3-conditions-on-an-outer-boundary"
on = ["outer_boundary"]
parameters.value = { unit = "C/m^2", description = "sigma, the free charge per unit area on the conductor's surface" }

[conditions.normal_flux]
description = "a known flux crosses the boundary, which is no charged conductor (a cut through a larger problem)"
section = "3-conditions-on-an-outer-boundary"
on = ["outer_boundary"]
parameters.value = { unit = "C/m^2", description = "q = n . D, with n pointing out of the domain" }

[conditions.interface]
description = "the two domains meet with phi and n . D continuous: no free charge on the face"
section = "4-between-two-domains"
on = ["interface"]

[sources.charge_density]
description = "free charge spread through a domain"
section = "5-sources"
on = ["body"]
parameters.value = { unit = "C/m^3", description = "rho, the free charge per unit volume" }

[derived.potential]
description = "phi, the electric potential"
section = "7-derived-quantities"
unit = "V"

[derived.electric_field]
description = "E = -grad phi"
section = "7-derived-quantities"
unit = "V/m"

[derived.displacement]
description = "D = eps_0 eps_r E"
section = "7-derived-quantities"
unit = "C/m^2"

[derived.energy_density]
description = "w = E . D / 2, the field's energy per unit volume"
section = "7-derived-quantities"
unit = "J/m^3"

# The benchmark set (models.md § 4, § 6.3): problems with known answers, each one of femkit's
# project templates by its bare name, and the exact value each observable of its study must reproduce.
[benchmarks.two_material]
description = "a layered capacitor: two materials in series between two held potentials, a named interface between them"
section = "91-two_material-a-layered-capacitor"
project = "two_material"
exercises = ["potential", "insulating", "interface", "relative_permittivity"]
tolerance = "1e-9"   # relative: first-order elements reproduce the piecewise-linear solution (§ 9)

[benchmarks.two_material.reference]
potential_low = "2/5 V"
potential_middle = "4/5 V"
potential_high = "9/10 V"
energy_low = "5.666680204032e-12 J/m"      # 0.64 eps_0, eps_0 as [constants] states it
energy_high = "1.416670051008e-12 J/m"     # 0.16 eps_0
