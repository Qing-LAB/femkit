# The project's own vacuum (materials.md § 3): its relative permittivity is exactly 1. A
# component names it `vacuum`; the project's own material comes before the global library's.

# the version of this file's format, which femkit raises when it changes how files of this kind are written: one of `1` (see models.md § 2)
schema = 1

# the name shown to a person; nothing refers to the material by it, since its folder's name is its name
display = "Vacuum"

# its chemical formula, as `Au` or `SiO2`
# formula = "Au"

# other names a search of a library finds it by; nothing refers to the material by them
# aliases = ["empty space"]

# each property, by its name in femkit's list of material properties, holding its datasets, each named by its source (see materials.md § 3)
[properties]

# the material's relative permittivity, in 1
[properties.relative_permittivity]

# the dataset named `definition`
[properties.relative_permittivity.definition]
# a constant, with its unit where it has one
value = "1"
# the convention of the source's complex values: one of `real`, `exp(-iwt)`, `exp(+iwt)`
convention = "real"
# where the data comes from: a citation a reader can check, with its DOI where there is one
source = "the definition of vacuum: its relative permittivity is exactly 1"
# where the data holds: `all`, or `[from, to]` in its variable
range = "all"

# anything kept beside the material; read by no step
# [notes]
