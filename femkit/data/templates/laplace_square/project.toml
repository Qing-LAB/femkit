# Laplace on a square: the potential between two held sides, with nothing between them but
# vacuum. Its exact answer is a potential that rises linearly from 0 V on the left to the bias
# on the right, so the midpoint holds half the bias at any mesh.
#
# This is the project file (projects.md § 2). Every key's help is the comment directly above
# it; a key shown commented out is one you may set.

# the version of this file's format, which femkit raises when it changes how files of this kind are written: one of `1` (see models.md § 2)
schema = 1

# what the project is, in a sentence or two
description = "Laplace on a square: 0 V on the left side, the bias on the right, the top and bottom insulating"

# the project's components, by name: each the folder `components/<name>/`, holding `component.toml` and `geometry.py`
components = ["square"]

# the project's studies, by name: each the file `studies/<name>.toml`
studies = ["check"]

# the shared parameters, by name: each a quantity with its unit, or an expression of other parameters with `+`, `-`, `*`, `/` and parentheses (see core.md § 11)
[parameters]
# the square's side; its script reads it
side = "1 m"
# the potential the right side is held at
bias = "1 V"
