# Gmsh, in the elmer environment: the one mesher (models.md § 6.5); ElmerGrid converts its meshes
# for Elmer. It writes MSH 2.2 ASCII (Gmsh's own default is MSH 4.1, so the translator asks for 2.2);
# which form the pipeline hands over is settled by measurement with the execution design (plan § 4, X).
description = "Gmsh with its OpenCASCADE kernel"
provided_by = "elmer"
dimensions = [2, 3]
builds = ["rectangle", "disk", "polygon", "box", "sphere", "cylinder", "extrusion",
          "union", "difference", "intersection", "import"]
imports = ["step", "iges", "brep"]
controls = ["size", "regions"]
tolerance = { kind = "absolute", value = "1e-8" }   # in the length unit geometry is handed over in
writes = { format = "msh", version = "2.2", encoding = "ascii" }
orders = [1, 2]
keeps_region_names = true
basis = "measured 2026-11-23 on gmsh 4.15.2 (conda-forge, OpenCASCADE 8.0.1): its build options, Geometry.Tolerance; orders 1 and 2, what ElmerGrid keeps of each not yet measured (plan § 4, X)"
