# Gmsh's mesher (workflow.md § 2.3; geometry.md §§ 5, 6): it fills the mesh stage's slots — run
# in the gmsh environment that provides it, its program meshes the geometry stage's shapes as the
# recipe says, in Gmsh's terms, and writes the mesh as MSH 2.2 text, every promised group a named
# group of it, and the region map. A mesh recipe states it, `mesher = "gmsh"`; Elmer takes its mesh
# at geometry orders 1 and 2 and NGSolve at 1, by their hand-overs (geometry.md § 8).
description = "Gmsh with its OpenCASCADE kernel"
provided_by = "gmsh"
dimensions = [2, 3]
tolerance = { kind = "absolute", value = "1e-8" }   # in the length unit geometry is handed over in
orders = [1, 2]
order = "recipe"
program = "mesh.py"
arguments = ["{recipe}", "{geometry}", "{mesh}", "{regions}"]
reads = { geometry = "geometry/xao" }
writes = { mesh = "mesh/msh-2.2", regions = "mesh/regions" }
honours = ["size", "order", "tolerance", "sizes", "growth", "quality"]
basis = """measured 2026-11-23 on Gmsh 4.15.2 (conda-forge, OpenCASCADE 8.0.1): its build options, \
Geometry.Tolerance; measured 2026-11-25: orders 1 and 2 written as MSH 2.2, every group a named \
group of it"""
