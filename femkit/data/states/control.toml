# The states of the control environment, the one femkit runs in (envs.md § 7.2), observed from
# the facts femkit/envs/control.py gathers and names: `prefix`, the manager names the environment
# `femkit` and its prefix is there;
# `environment`, it holds `conda-meta/`; `python`, its `bin/python` can be run; `stamp`, its
# stamp file is there; `stamp_matches`, the stamp holds the SHA-256 of channels.txt then
# control.txt; `command`, its `femkit` command is the one the install script writes from this
# checkout; `linked`, `<bin>/femkit` is a link to that command (envs.md § 7). The first rule that
# holds gives the state.
#
# scripts/install-env.sh observes it too, by these rules written in bash, since it runs before
# femkit can; tests/basic/test_entry.py holds the two equal on every way the prefix can stand.

[states]
absent = "the manager names no environment femkit"
broken = "no conda-meta/, no bin/python, or no stamp file"
outdated = "the stamp's SHA-256 is not that of channels.txt then control.txt"
unlinked = "its femkit command is missing, or is not the one the script writes from this checkout, or <bin>/femkit is not a link to it"
current = "otherwise: Python runs femkit from it, its femkit command runs this checkout, and femkit is linked"

[[rules]]
state = "absent"
when = "not prefix"

[[rules]]
state = "broken"
when = "not environment or not python or not stamp"

[[rules]]
state = "outdated"
when = "not stamp_matches"

[[rules]]
state = "unlinked"
when = "not command or not linked"

[[rules]]
state = "current"
when = "otherwise"

# What each state allows (envs.md § 7.3): the install script's bootstrap, which creates or
# rebuilds it — never with --clean, which rebuilds every default environment too — and writes its
# `femkit` command; `{script}` is the script by its absolute path in this checkout, so the line
# pastes from any folder. The script names the same line when it refuses any other verb.
[actions.absent]
bootstrap = { describe = "create it", shell = "bash {script} bootstrap" }

[actions.broken]
bootstrap = { describe = "remove it, create it", shell = "bash {script} bootstrap" }

[actions.outdated]
bootstrap = { describe = "remove it, create it", shell = "bash {script} bootstrap" }

[actions.unlinked]
bootstrap = { describe = "write its femkit command, naming this checkout, and link it", shell = "bash {script} bootstrap" }

[actions.current]
