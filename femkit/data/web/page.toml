# The web page's own structure (web.md § 8.1): what the page shows and in what order, the
# context it works in, the icon of each kind of object, the keys it answers. The page draws all
# of it from here and keeps no list of its own; `schema check` loads it.
schema = 1

[app]
name = "femkit"
tagline = "Finite-element results you can inspect and reproduce, from physical intent to the fields, on a workstation or a cluster."
mark = "mark.svg"

[[workspaces]]
key = "project"
title = "Project"
icon = "workflow"
tagline = "The project as a graph: its parts, what each names, and what is wrong, in the chain's order."
help = "Select a node to read its text and its findings; the next step stays in view until every part checks."
document = "project.graph"
context = ["project"]
empty = "Open a project to see its parts — choose one, or make a new one from a template."

[[workspaces]]
key = "runs"
title = "Runs"
icon = "list-checks"
tagline = "A project's cases, and the studies they come from."
help = "Expand a study to write its cases; each case is one point of its axes."
document = "case.list"
context = ["project"]
empty = "Open a project to see its cases."

[[workspaces]]
key = "operations"
title = "Operations"
icon = "terminal"
tagline = "Every operation femkit has, as a form."
help = "What the command line does, the page does here: each operation planned, then applied."
context = []
empty = "Choose an operation."

[[context]]
key = "project"
label = "project"
help = "A project under the projects root: its parameters, components, materials, physics, mesh recipes, observable sets and studies."
choices = "project.list"
rows = "projects"
value_key = "name"
depends = []

[[context]]
key = "study"
label = "study"
help = "A study pairs a component with its physics, a mesh recipe and observable sets; its cases are what runs."
choices = "study.list"
rows = "studies"
value_key = "name"
depends = ["project"]

[[context]]
key = "environment"
label = "environment"
help = "An engine environment; with one chosen, each node shows how it would run there."
choices = "env.list"
rows = "rows"
value_key = "name"
depends = []

# Each part kind's and object type's icon, as the project layout names them (web.md § 8.2).
[kinds]
project = "folder"
material = "layers"
component = "shapes"
physics = "atom"
mesh = "grid-3x3"
observables = "gauge"
study = "flask-conical"
parameter = "variable"
property = "beaker"
frame = "ruler"
input = "log-in"
input_file = "file"
group = "map-pin"
assignment = "paintbrush"
condition = "shield"
source = "zap"
radiation = "radio"
size = "maximize"
observable = "crosshair"
step = "play"
numerics = "sigma"
axis = "sliders-horizontal"
crossing = "merge"
binding = "plug"

[[shortcuts]]
key = "Escape"
command = "cancel"
help = "Close what is open."
